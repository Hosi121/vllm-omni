[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-stage-contracts"
version = "0.1.0"
description = "Dependency-free stage contracts from the vLLM-Omni repository"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
wire = ["numpy>=1.24"]

[tool.setuptools]
packages = ["omni_stage_contracts"]
