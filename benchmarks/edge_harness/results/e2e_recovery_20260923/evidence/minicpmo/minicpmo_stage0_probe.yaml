# MiniCPM-o 4.5 one-stage thinker diagnostic on the RTX 5090 Laptop.
# The probe registers a text-only PipelineConfig before creating Omni.
# No thinker weights are offloaded; context, concurrency and input modalities
# are bounded. This is a diagnosis, not the three-stage speech configuration.
pipeline: minicpmo_4_5
trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 3
      # HiFT capture buckets are derived from codec_chunk_frames and
      # codec_left_context_frames. (#5869)
      # A future initial_codec_chunk_frames shape will use lazy capture unless
      # HiFTGraphWrapper.derive_capture_bucket_size explicitly includes it.
      enable_hift_graph: true
      enable_cfm_graph: true
      cfm_max_graphs: 32

stages:
  - stage_id: 0
    max_num_seqs: 1
    # Bound the thinker budget while keeping its weights resident.
    gpu_memory_utilization: 0.85
    cpu_offload_gb: 0
    enforce_eager: true
    tensor_parallel_size: 1
    max_num_batched_tokens: 2048
    max_model_len: 2048
    devices: "0"
    # Present in the parent profile; this probe submits text only.
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
    limit_mm_per_prompt:
    # No image, audio or video inputs are admitted in this text-to-speech probe.
      image: 0
      audio: 0
      video: 0
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 64
      seed: 42
      detokenize: true
      # 1.0 for MCQ accuracy; 1.1 can bias short A–D answers.
      repetition_penalty: 1.0
